services:
  - type: web
    name: sistema-gestion-api
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ${RENDER_EXTERNAL_URL}
